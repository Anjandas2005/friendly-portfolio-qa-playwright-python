[pytest]
minversion = 8.0
addopts = 
    --base-url https://myportfolio-virid-nine-58.vercel.app
    --browser chromium
    --screenshot only-on-failure
    --video retain-on-failure
    --tracing retain-on-failure
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    smoke: Critical deployment and availability tests
    navigation: Header, footer, and anchor navigation tests
    hero: Landing section and CTA button tests
    projects: Project cards, tech stack, and content tests
    about: Dedicated about page, education, and skills tests
    contact: Contact links and communication channel tests
    responsive: Viewport layout tests across mobile and tablet
    a11y: Semantic HTML and accessibility compliance tests
