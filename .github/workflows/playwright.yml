name: Playwright Portfolio E2E Tests

on:
  schedule:
    # Runs daily at 6:00 AM IST (00:30 UTC)
    # Note: GitHub Actions schedule triggers evaluate in UTC
    - cron: '30 0 * * *'
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Run Playwright Tests & Generate Reports
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers with OS Dependencies
        run: playwright install --with-deps chromium firefox

      - name: Run Playwright Test Suite
        env:
          BASE_URL: https://myportfolio-virid-nine-58.vercel.app
        run: |
          pytest -n auto

      - name: Upload HTML Test Report & Failure Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-execution-reports
          path: |
            reports/
            test-results/
          retention-days: 30

      - name: Locate HTML Test Report
        if: always()
        id: report_prep
        run: |
          mkdir -p reports
          REPORT_FILE=$(find reports -maxdepth 1 -name "*.html" 2>/dev/null | head -n 1)
          if [ -n "$REPORT_FILE" ] && [ -f "$REPORT_FILE" ]; then
            echo "Found HTML report: $REPORT_FILE"
            echo "report_path=$REPORT_FILE" >> $GITHUB_OUTPUT
            echo "report_exists=true" >> $GITHUB_OUTPUT
          else
            echo "No HTML report found in reports/ directory"
            echo "report_path=" >> $GITHUB_OUTPUT
            echo "report_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Send HTML Report via Email
        if: always()
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: ${{ secrets.MAIL_SERVER || 'smtp.zoho.in' }}
          server_port: ${{ secrets.MAIL_PORT || 465 }}
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Daily Portfolio Test Report - ${{ job.status }} [${{ github.ref_name }}]"
          to: anjan.das.dev@zohomail.in
          from: ${{ secrets.MAIL_FROM || secrets.MAIL_USERNAME }}
          body: |
            Hi Anjan,

            The automated Playwright E2E test suite for Oyendri Sana's Portfolio has completed execution.

            📊 Execution Summary:
            • Status: ${{ job.status }}
            • Target: https://myportfolio-virid-nine-58.vercel.app
            • Event: ${{ github.event_name }}
            • Triggered By: ${{ github.actor }}
            • Branch: ${{ github.ref_name }}
            • Commit SHA: ${{ github.sha }}
            • Workflow Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            The complete self-contained HTML test report is attached to this email.
          attachments: ${{ steps.report_prep.outputs.report_path }}
